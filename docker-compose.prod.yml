version: '3.8'

services:
  promotion-service:
    image: truongikpk/bookstore-promotion-service:v1.0.0
    container_name: promotion-service
    ports:
      - "8086:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
    networks:
      - bookstore-network

networks:
  bookstore-network:
    external: true
