services:
  promotion-db:
    image: mysql:8.0
    container_name: promotion-db
    ports:
      - "3307:3306"
    environment:
      MYSQL_DATABASE: promotion_db
      MYSQL_ROOT_PASSWORD: password
    volumes:
      - promotion-db-data:/var/lib/mysql
    networks:
      - bookstore-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-ppassword"]
      interval: 5s
      timeout: 5s
      retries: 20

  promotion-service:
    build: 
      context: .
      target: build
    container_name: promotion-service
    ports:
      - "8086:8080"
    volumes:
      - .:/app
      - ~/.m2:/root/.m2
    working_dir: /app
    command: mvn spring-boot:run -Dspring-boot.run.profiles=dev
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SPRING_DATASOURCE_URL: jdbc:mysql://promotion-db:3306/promotion_db?createDatabaseIfNotExist=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: password
      BOOK_SERVICE_URL: http://book-service:8080
    depends_on:
      promotion-db:
        condition: service_healthy
    networks:
      - bookstore-network

volumes:
  promotion-db-data:

networks:
  bookstore-network:
    external: true
